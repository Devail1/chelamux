<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>chela · shared terminal</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root { --bg:#0a0c11; --panel:#0d1117; --border:#1f2632; --fg:#c9d1d9; --dim:#7d8590; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --err:#f85149; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; overflow:hidden; }
  #bar { position:fixed; top:0; left:0; right:0; height:34px; display:flex; align-items:center; gap:10px;
    padding:0 12px; background:var(--panel); border-bottom:1px solid var(--border); z-index:10; }
  #bar .mark { font-weight:700; letter-spacing:.02em; }
  #bar .mark b { color:var(--accent); }
  #bar .title { color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #bar .spacer { flex:1; }
  #bar .tag { font-size:11px; color:var(--dim); border:1px solid var(--border); border-radius:999px; padding:2px 8px; }
  #bar .facepile { display:inline-flex; align-items:center; height:22px; }
  #bar .lock { font-size:11px; color:var(--ok); }
  #dot { width:8px; height:8px; border-radius:50%; background:var(--warn); box-shadow:0 0 0 3px rgba(210,153,34,.15); }
  #dot.up { background:var(--ok); box-shadow:0 0 0 3px rgba(63,185,80,.15); }
  #dot.down { background:var(--err); box-shadow:0 0 0 3px rgba(248,81,73,.15); }
  #stage { position:fixed; inset:34px 0 0 0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 620px at 50% 32%,#151a23,#0a0c11); overflow:hidden; }
  #term { box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 12px 48px rgba(0,0,0,.55); border-radius:6px; }
  .xterm { padding:6px; }
  /* Match the chela dashboard scrollbar: thin, track-less, subtle thumb that
     brightens on hover (the xterm viewport + the mobile pan-fallback stage). */
  .xterm-viewport, #stage { scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
  .xterm-viewport::-webkit-scrollbar, #stage::-webkit-scrollbar { width:8px; height:8px; }
  .xterm-viewport::-webkit-scrollbar-track, #stage::-webkit-scrollbar-track { background:transparent; }
  .xterm-viewport::-webkit-scrollbar-thumb, #stage::-webkit-scrollbar-thumb {
    background:var(--border); border-radius:8px; border:2px solid transparent; background-clip:content-box; }
  .xterm-viewport::-webkit-scrollbar-thumb:hover, #stage::-webkit-scrollbar-thumb:hover {
    background:#30363d; background-clip:content-box; }
  /* Pairing-code entry gate — shown until keys are derived and the first frame
     decrypts. The terminal never renders a byte before the code is proven. */
  #gate { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 620px at 50% 30%,#141922,#0a0c11); }
  #gate.hide { display:none; }
  #card { width:min(420px,92vw); background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:26px 24px; box-shadow:0 18px 60px rgba(0,0,0,.6); }
  #card h1 { margin:0 0 4px; font-size:17px; }
  #card h1 b { color:var(--accent); }
  #card p { margin:0 0 18px; color:var(--dim); font-size:12.5px; }
  /* font-size MUST be >=16px: iOS Safari auto-zooms the viewport when focusing an
     input smaller than 16px, and that zoom persists after the gate closes. */
  #code { width:100%; padding:11px 12px; font:600 16px/1 ui-monospace,Menlo,Consolas,monospace;
    letter-spacing:.12em; text-transform:uppercase; color:var(--fg); background:#0a0c11;
    border:1px solid var(--border); border-radius:8px; outline:none; }
  #code:focus { border-color:var(--accent); }
  #name { width:100%; padding:10px 12px; margin-bottom:10px; font:500 16px system-ui;
    color:var(--fg); background:#0a0c11; border:1px solid var(--border); border-radius:8px; outline:none; }
  #name:focus { border-color:var(--accent); }
  #join { margin-top:14px; width:100%; padding:11px; font:600 14px system-ui; color:#04101f;
    background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  #join:disabled { opacity:.5; cursor:default; }
  #err { margin-top:12px; min-height:16px; color:var(--err); font-size:12.5px; }
  .lockrow { display:flex; align-items:center; gap:7px; margin-bottom:14px; color:var(--dim); font-size:12px; }
  .lockrow b { color:var(--ok); }
</style>
</head>
<body>
  <div id="bar">
    <span class="mark">chela<b>·</b></span>
    <span class="title" id="title">shared terminal</span>
    <span class="spacer"></span>
    <span class="lock">🔒 end-to-end</span>
    <span class="tag">live</span>
    <span class="facepile" id="facepile"></span>
    <span id="dot" title="enter code"></span>
  </div>
  <div id="stage"><div id="term"></div></div>

  <div id="gate">
    <div id="card">
      <h1>Join <b>chela</b> terminal</h1>
      <p>End-to-end encrypted. Paste the pairing code the host gave you — the relay never sees the stream.</p>
      <div class="lockrow">🔒 <span>AES-256-GCM · <b>keys derived in your browser</b></span></div>
      <input id="name" autocomplete="off" maxlength="24" spellcheck="false"
             placeholder="Your name (optional)" aria-label="your name">
      <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false"
             placeholder="PAIRING CODE" aria-label="pairing code">
      <button id="join" disabled>Join</button>
      <div id="err"></div>
    </div>
  </div>

  <script src="/vendor/xterm.js"></script>
  <script type="module">
    import { Session, PresenceSession, secretFromCode, T_OUTPUT, T_INPUT, T_META, T_PRESENCE, T_CTL, AuthError, BadFrame } from '/e2e.js';
    import { identity, saveName, autoName, colorForId, PeerStore, throttle, toNorm, fromNorm,
             makePointer, renderFacepile, PRESENCE_TIMEOUT_MS, HEARTBEAT_MS } from '/presence-core.js';

    const room = decodeURIComponent((location.pathname.match(/\/j\/([^/]+)/) || [, ''])[1]);
    const WS = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/room/' + room;
    const BAR = 34;
    // A proven pairing code is stashed per-room so a page refresh doesn't force
    // re-entry. sessionStorage (tab-scoped, cleared on tab close), NOT the URL
    // fragment — a #code would leak the key into the shareable link.
    const PAIR_KEY = 'chela_pair_' + room;
    let pendingCode = '';
    const dot = document.getElementById('dot');
    const gate = document.getElementById('gate');
    const errEl = document.getElementById('err');
    const codeEl = document.getElementById('code');
    const nameEl = document.getElementById('name');
    const joinBtn = document.getElementById('join');
    const titleEl = document.getElementById('title');
    const setDot = (cls, t) => { dot.className = cls; dot.title = t; };

    const term = new Terminal({
      cursorBlink: false, convertEol: false,
      fontFamily: 'JetBrains Mono, Menlo, Consolas, monospace', fontSize: 14,
      theme: { background:'#0d1117', foreground:'#c9d1d9', cursor:'#58a6ff', cursorAccent:'#0d1117',
        selectionBackground:'#264f78', black:'#484f58', red:'#ff7b72', green:'#3fb950', yellow:'#d29922',
        blue:'#58a6ff', magenta:'#bc8cff', cyan:'#39c5cf', white:'#b1bac4', brightBlack:'#6e7681',
        brightRed:'#ffa198', brightGreen:'#56d364', brightYellow:'#e3b341', brightBlue:'#79c0ff',
        brightMagenta:'#d2a8ff', brightCyan:'#56d4dd', brightWhite:'#f0f6fc' },
    });
    term.open(document.getElementById('term'));

    // Letterbox the FIXED master grid by scaling fontSize (never CSS transform).
    // KEEP one shared master grid — TUIs can't reflow client-side and writable
    // mode (P1.5) needs a single grid so cursor/selection stay aligned.
    let grid = { cols: 80, rows: 24 };
    const MINF = 6, MAXF = 40;
    const stage = document.getElementById('stage');
    const fitFont = () => {
      const screen = term.element && term.element.querySelector('.xterm-screen');
      if (!screen) return;
      const cur = term.options.fontSize || 14, sw = screen.offsetWidth, sh = screen.offsetHeight;
      if (!sw || !sh) return;
      // Fit to the LAYOUT viewport, made ZOOM-INVARIANT. visualViewport.{width,height}
      // shrink under a pinch OR an iOS input auto-zoom, but width*scale (≈ height*scale)
      // recovers the unzoomed layout size. So a stuck input-zoom no longer starves the
      // fit (the old `scale > 1` guard bailed every frame and the font never shrank),
      // and a deliberate user pinch isn't fought — the computed font is identical either
      // way, so the pinch just magnifies pixels. offsetWidth/Height are layout px too, so
      // both sides of the ratio share units.
      const vv = window.visualViewport;
      const availW = vv ? vv.width * vv.scale : innerWidth;
      const availH = (vv ? vv.height * vv.scale : innerHeight) - BAR;
      if (availW <= 0 || availH <= 0) return;
      const next = Math.max(MINF, Math.min(MAXF, Math.floor(cur * Math.min(availW / sw, availH / sh))));
      if (next !== cur) { term.options.fontSize = next; return; }  // re-measured next frame
      // Converged. Pan fallback: if the grid still overflows at MINF (wide grid on a
      // narrow phone), scroll from the top-left of the OVERFLOWING axis — a centred flex
      // item can't be scrolled to reveal edges clipped centre-out. Centre the other axis.
      const tw = term.element.offsetWidth, th = term.element.offsetHeight;
      const overX = tw > availW + 1, overY = th > availH + 1;
      stage.style.overflowX = overX ? 'auto' : 'hidden';
      stage.style.overflowY = overY ? 'auto' : 'hidden';
      stage.style.justifyContent = overX ? 'flex-start' : 'center';
      stage.style.alignItems = overY ? 'flex-start' : 'center';
    };
    // fontSize changes reflow the grid, so re-measure until the font settles, then
    // the final pass lands on the converged branch above and sets the pan/overflow.
    const refit = () => {
      let tries = 0;
      const step = () => {
        const before = term.options.fontSize;
        fitFont();
        if (term.options.fontSize !== before && ++tries < 8) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };
    const applyGrid = (cols, rows) => {
      if (!cols || !rows) return;
      grid = { cols, rows };
      if (term.cols !== cols || term.rows !== rows) { try { term.resize(cols, rows); } catch (_) {} }
      refit();
    };
    addEventListener('resize', refit);
    addEventListener('orientationchange', refit);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

    // --- crypto + transport ---------------------------------------------------
    let session = null, presence = null, secret = null, ws = null, paired = false, ended = false, backoff = 500;
    let pairTimer = null;
    // If no frame decrypts within this window the room is empty/dead (a stopped
    // share or a bad link) — show 'not found' instead of hanging on 'Deriving keys…'.
    // Overridable for tests via window.__CHELA_PAIR_MS__.
    const PAIR_TIMEOUT = Number(window.__CHELA_PAIR_MS__) || 9000;
    const enc = new TextEncoder(), dec = new TextDecoder();

    // Send path: serialise seal+send so each channel's per-stream seq stays strictly
    // increasing on the wire. `sess` is the terminal Session OR the PresenceSession
    // (separate keys/seqs, same socket). Hello, typed input and presence funnel here.
    let sendChain = Promise.resolve();
    const chainSend = (sess, typ, bytes) => {
      sendChain = sendChain.then(async () => {
        if (!sess || !ws || ws.readyState !== 1) return;
        ws.send(await sess.seal(typ, bytes));
      }).catch(() => {});
    };
    const sealSend = (typ, bytes) => chainSend(session, typ, bytes);

    // Full access: a paired joiner can type. Keystrokes → T_INPUT. Before pair,
    // session is null so sealSend no-ops; after pair the gate hides and the terminal
    // is focused, so typing (and scrolling, which the app reads as input) just works.
    term.onData((d) => sealSend(T_INPUT, enc.encode(d)));

    // --- presence (cursors + facepile) ---------------------------------------
    const me = identity(room);                  // { peerId (persisted), name (may be '') }
    const peers = new PeerStore();
    const pointers = new Map();                 // peerId -> makePointer() handle
    const facepileEl = document.getElementById('facepile');
    let lastCursor = null, heartbeat = 0, pruneTimer = 0;
    const myName = () => me.name || autoName(me.peerId);
    const screenRect = () => {
      const s = term.element && term.element.querySelector('.xterm-screen');
      return s ? s.getBoundingClientRect() : null;
    };
    // Send my cursor as grid-normalized (null when off-grid → peers hide the pointer).
    const sendPresence = (x, y) => {
      lastCursor = (x == null ? null : { x, y });
      chainSend(presence, T_PRESENCE, enc.encode(JSON.stringify(
        { id: me.peerId, name: myName(), host: false, x, y })));
    };
    const onMove = throttle((cx, cy) => { const n = toNorm(cx, cy, screenRect()); sendPresence(n ? n.x : null, n ? n.y : null); }, 45);
    const renderPresence = () => {
      const rect = screenRect(), live = peers.list();
      renderFacepile(facepileEl, [{ id: me.peerId, name: myName(), color: colorForId(me.peerId), host: false }, ...live]);
      for (const p of live) {
        let ptr = pointers.get(p.id);
        if (!ptr) { ptr = makePointer(); document.body.appendChild(ptr.el); pointers.set(p.id, ptr); }
        ptr.color(p.color); ptr.label(p.name);
        if (rect && p.x != null && p.y != null) { const q = fromNorm(p.x, p.y, rect); ptr.at(q.x, q.y); } else ptr.off();
      }
      for (const [id, ptr] of pointers) if (!peers.peers.has(id)) { ptr.el.remove(); pointers.delete(id); }
    };
    let presChain = Promise.resolve();
    const handlePresence = async (env) => {
      let pt; try { [, pt] = await presence.open(env); } catch (_) { return; }   // wrong key / replay → drop
      try { const m = JSON.parse(dec.decode(pt)); if (m.id !== me.peerId) { peers.update(m, performance.now()); renderPresence(); } } catch (_) {}
    };
    const startPresence = async () => {
      if (presence || !secret) return;
      presence = await PresenceSession.create(secret, room);
      stage.addEventListener('pointermove', (e) => onMove(e.clientX, e.clientY));
      stage.addEventListener('pointerleave', () => sendPresence(null, null));
      heartbeat = setInterval(() => { const c = lastCursor; sendPresence(c ? c.x : null, c ? c.y : null); }, HEARTBEAT_MS);
      pruneTimer = setInterval(() => { if (peers.prune(performance.now(), PRESENCE_TIMEOUT_MS)) renderPresence(); }, 1000);
      renderPresence();                          // show my own avatar right away
    };
    const stopPresence = () => {
      clearInterval(heartbeat); clearInterval(pruneTimer); heartbeat = pruneTimer = 0;
      for (const [, ptr] of pointers) ptr.el.remove();
      pointers.clear(); peers.peers.clear(); presence = null; lastCursor = null;
      if (facepileEl) facepileEl.textContent = '';
    };

    const hello = () => {
      // COLD-JOIN: on connect AND reconnect, ask the host for a keyframe (the relay
      // holds no history) — the host replies with a keyframe + current grant state.
      sealSend(T_CTL, enc.encode(JSON.stringify({ t: 'hello', cols: grid.cols, rows: grid.rows })));
    };
    // WebCrypto is async and frames must be opened in seq order, so serialise
    // decryption through a promise chain (concurrent open() would race _recvLast).
    let chain = Promise.resolve();
    const onFrame = (buf) => {
      const env = new Uint8Array(buf);
      // Route by the cleartext type byte: presence rides the same socket on its own
      // key/seq, serialised through its own chain so concurrent open()s don't race.
      if (env.length >= 2 && env[1] === T_PRESENCE) { presChain = presChain.then(() => handlePresence(env)).catch(() => {}); return; }
      chain = chain.then(() => handleFrame(env)).catch(() => {});
    };
    const handleFrame = async (env) => {
      let typ, pt;
      try {
        [typ, pt] = await session.open(env);
      } catch (e) {
        if (e instanceof AuthError && !paired) return failWrongCode();
        return; // paired tamper / replay / reorder → drop
      }
      if (!paired) {
        paired = true; clearTimeout(pairTimer); gate.classList.add('hide'); setDot('up', 'live · encrypted');
        term.focus();   // full-access: ready to type immediately
        startPresence();
        try { sessionStorage.setItem(PAIR_KEY, pendingCode); } catch (_) {}
      }
      if (typ === T_OUTPUT) term.write(pt);
      else if (typ === T_META) {
        try { const m = JSON.parse(dec.decode(pt)); applyGrid(m.cols, m.rows); if (m.title) titleEl.textContent = m.title; } catch (_) {}
      } else if (typ === T_CTL) {
        try { const m = JSON.parse(dec.decode(pt)); if (m.t === 'ended') showEnded('This share has ended.'); } catch (_) {}
      }
    };
    const connect = () => {
      setDot('', 'connecting…');
      ws = new WebSocket(WS);
      ws.binaryType = 'arraybuffer';
      ws.onopen = () => { backoff = 500; if (paired) setDot('up', 'live · encrypted'); hello(); };
      ws.onmessage = (ev) => onFrame(ev.data);
      ws.onclose = () => { if (ended) return; if (paired) { setDot('down', 'reconnecting…'); setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 8000); } };
      ws.onerror = () => { try { ws.close(); } catch (_) {} };
    };

    const failWrongCode = () => {
      paired = false; clearTimeout(pairTimer);
      try { ws && ws.close(); } catch (_) {}
      try { sessionStorage.removeItem(PAIR_KEY); } catch (_) {}  // stale/rotated code — don't re-prefill it
      session = null;
      gate.classList.remove('hide');
      errEl.textContent = 'Wrong pairing code — that key can’t decrypt this stream.';
      joinBtn.disabled = false; joinBtn.textContent = 'Join';
      codeEl.focus(); codeEl.select();
    };

    // The share is over (host broadcast 'ended') OR nothing ever answered (empty/
    // dead room → pairing timeout). Distinct from wrong-code: the key was fine,
    // there's just no live share. No reconnect; a fresh code can still retry.
    const showEnded = (msg) => {
      ended = true; paired = false; clearTimeout(pairTimer); stopPresence();
      try { ws && ws.close(); } catch (_) {}
      try { sessionStorage.removeItem(PAIR_KEY); } catch (_) {}
      session = null;
      gate.classList.remove('hide');
      setDot('down', 'share ended');
      errEl.textContent = msg;
      joinBtn.disabled = false; joinBtn.textContent = 'Join';
    };

    // --- gate: derive keys from the pasted code, then connect -----------------
    const submit = async () => {
      errEl.textContent = ''; ended = false;
      pendingCode = codeEl.value.trim();
      me.name = nameEl.value.trim(); saveName(room, me.name);   // '' → auto (adjective-animal)
      try { secret = secretFromCode(codeEl.value); }
      catch (e) { errEl.textContent = (e instanceof BadFrame) ? 'That doesn’t look like a valid code.' : String(e.message || e); return; }
      joinBtn.disabled = true; joinBtn.textContent = 'Deriving keys…';
      try { session = await Session.create(secret, room, 'joiner'); }
      catch (e) { errEl.textContent = 'Key derivation failed: ' + (e.message || e); joinBtn.disabled = false; joinBtn.textContent = 'Join'; return; }
      connect();
      // Arm the dead-room timeout: no decrypted frame within PAIR_TIMEOUT → 'ended'.
      clearTimeout(pairTimer);
      pairTimer = setTimeout(() => { if (!paired) showEnded('Share not found — it may have ended, or the link is wrong.'); }, PAIR_TIMEOUT);
    };
    codeEl.addEventListener('input', () => { joinBtn.disabled = codeEl.value.trim().length < 10; errEl.textContent = ''; });
    codeEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !joinBtn.disabled) submit(); });
    joinBtn.addEventListener('click', submit);

    nameEl.value = me.name;   // prefill the stored name (blank → auto on join)

    // Refresh continuity: if this tab already proved a code for this room, prefill
    // and auto-join. A stale code (host rotated the share) just fails the first GCM
    // tag → failWrongCode clears the store and shows the gate. Self-correcting.
    let stored = '';
    try { stored = sessionStorage.getItem(PAIR_KEY) || ''; } catch (_) {}
    if (stored) {
      codeEl.value = stored;
      joinBtn.disabled = stored.length < 10;
      submit();
    } else {
      codeEl.focus();
    }
  </script>
</body>
</html>

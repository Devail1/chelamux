<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>chela – Mission Control</title>
    <link rel="icon" href="{{ asset_path('img/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ asset_path('vendor/gridstack.min.css') }}">
    <!-- CMX-248: style.css is the build entry's (frontend/src/main.tsx imports it). -->
    {% if app_css %}<link rel="stylesheet" href="{{ app_css }}">{% endif %}
</head>
<body>
<!-- CMX-89: restore the collapsed desktop sidebar BEFORE first paint: the bundle runs only
     after it has loaded, so the expanded sidebar would paint first and then fold. The key is
     the sidebar controller's SIDEBAR_COLLAPSED_KEY; phone CSS ignores the class. -->
<script>try { if (localStorage.getItem('chela_sidebar_collapsed') === '1') document.body.classList.add('sidebar-collapsed'); } catch (e) {}</script>

<!-- CMX-217: the boot config the bundle reads (frontend/src/shared/api readBoot). -->
<script type="application/json" id="chela-boot">{{ boot|tojson }}</script>

<!-- CMX-248 (FRONTEND_PORT_PLAN.md P34): the page is one React root, frontend/src/features/shell's
     <App>: the sidebar, the canvas, the safety float and the overlays. -->
<div id="root"></div>

<script src="{{ asset_path('vendor/gridstack-all.js') }}"></script>
<!-- CMX-215: the page's one module script, the Vite build (docs/FRONTEND.md). Module scripts run
     after parsing, so the boot block, #root and gridstack above exist by then. -->
{% if app_src %}<script type="module" src="{{ app_src }}"></script>{% endif %}
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>chela – Mission Control</title>
    <link rel="icon" href="{{ asset_path('img/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ asset_path('vendor/gridstack.min.css') }}">
    <link rel="stylesheet" href="{{ asset_path('style.css') }}">
</head>
<body>
<!-- CMX-89: restore the collapsed desktop sidebar BEFORE first paint. nav.js
     does the same, but as a module it runs only after its whole import graph has
     loaded, so the expanded sidebar painted first and then folded. Key must match
     nav.js's SIDEBAR_COLLAPSED_KEY; mobile CSS ignores the class. -->
<script>try { if (localStorage.getItem('chela_sidebar_collapsed') === '1') document.body.classList.add('sidebar-collapsed'); } catch (e) {}</script>

<div class="app">

  <!-- CMX-377: the calm-desktop-app restyle drops the full-width topbar
       (index.html used to open with <header class="topbar">, grid-column 1/3
       above the sidebar+canvas row). Everything it held moves onto the
       sidebar itself — a fixed head (toggle + brand) and a fixed foot
       (ambient readouts + Decisions/Menu) around the scrollable nav — so the
       sidebar is the ONE piece of chrome, not a bar-plus-sidebar pair. The two
       safety-critical pills (#btn-shares, #status-health-warn) move OUT of
       the sidebar entirely into `.safety-float` below `</main>`: the sidebar
       is `position:fixed` + `transform`-slid on a phone when closed
       (off-canvas drawer), and a transformed ancestor becomes the containing
       block for any `position:fixed` descendant — trapping it off-screen too
       — so "must always be visible" cannot live inside the sidebar on mobile.
       `.mobile-menu-fab` is the phone-only replacement for the old hamburger:
       the sidebar's own toggle (in `.sidebar-head` below) is unreachable while
       the drawer is closed, exactly the same off-canvas problem. -->
  <!-- Left sidebar: Navigate (views) · Sessions (live agents) · Recent sessions
       (dead-but-resumable, CMX-208 — hidden when empty). No filter chips.
       Favorites/Recent DIRECTORIES are LAUNCH affordances, not navigation — they
       live in the "+" launch menu (#new-menu), not a sidebar section. Recent
       SESSIONS below is a different thing entirely: resuming a specific prior
       Claude conversation (session id), not opening a fresh window in a familiar
       directory — see chela/restore.py. -->
  <aside class="sidebar">

    <!-- ONE sidebar control, two behaviours (nav.js toggleSidebar): a phone slides
         the off-canvas drawer in over a scrim; a desktop collapses the column to an
         icon rail (persisted). Lives here (not a topbar) — on a phone it's reachable
         only while the drawer is already open, which is fine: `.mobile-menu-fab`
         below is the one that opens it from closed. -->
    <div class="sidebar-head">
      <button class="icon-btn sidebar-toggle" id="btn-menu" title="Toggle sidebar"
              aria-label="Toggle sidebar" aria-expanded="true" onclick="chela.toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="brand"><img src="{{ asset_path('img/claw-mark.svg') }}" class="brand-mark" alt=""><span>chela</span></div>
      <!-- CMX-393: the inbox moved up here from the foot (as in the approved
           mockup), so the foot is ONE row: readouts left, one menu right. It sits
           at the head's right end; the toggle stays first because the phone's
           ☰ FAB floats exactly over it, so open and close share one spot. -->
      <div class="sidebar-head-actions">
        <!-- Decisions inbox (CMX-228): the durable, owner-independent record of every
             dispatch outcome chela/inbox.py has ever queued. The island
             (frontend/src/features/decisions) draws the inbox button here, with the
             orchestrator's dot and the unread badge, and opens the log as a dialog. -->
        <span class="decisions-island" id="decisions-island"></span>
      </div>
    </div>

    <div class="sidebar-scroll">

      <!-- CMX-377: New session + jump-to search, ahead of nav (mockup order —
           head -> New session -> jump-to search -> nav). "New session" opens the
           launch menu (the launcher island, frontend/src/features/launcher, CMX-219):
           there is only one launch surface, this is just its prominent entry point. The search input reuses the ⌘K palette
           (frontend/src/features/palette) rather than a second implementation:
           typing here opens/drives it in place, focus staying here, and the
           palette's arrow/Enter keys work off it being open, not focus (see its
           sidebarJumpInput). -->
      <div class="sidebar-quick">
        <span class="island-slot" id="sidebar-new-island"></span>
        <label class="sidebar-jump">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="sidebar-jump-input" placeholder="Jump to session" aria-label="Jump to session"
                 autocomplete="off" spellcheck="false"
                 onfocus="chela.sidebarJumpInput(this)" oninput="chela.sidebarJumpInput(this)">
        </label>
      </div>

      <!-- Primary navigation. NOT written here: the sidebar island (CMX-278) draws these rows from the
           view REGISTRY (static/js/views.js) — one declaration per view, so adding
           or deleting a view is one entry there and nothing here.

           CMX-279 (measured, not assumed — Liav named exactly two of the seven
           views he actually opens): Wall and Work. CMX-230 had tried demoting the
           other five into a quieter secondary group below this one rather than
           deleting them (`#side-nav-more`); that group is gone along with the
           views it held — there is only one nav list now. -->
      <section class="side-section">
        <div class="side-head"><span class="side-title">Navigate</span></div>
        <div class="side-list" id="side-nav"></div>
      </section>

      <!-- Live tmux sessions. The header is a plain label; click a row to land on
           its pane (selectAgent → focusPaneByWid). A live fleet is a handful of
           windows and always fits the viewport, so there is no type filter — the
           window type is a per-row cue (glyph + colour), not a way to hide rows. -->
      <section class="side-section">
        <div class="side-head">
          <span class="side-title">Sessions</span>
          <!-- CMX-219: the agent count, from /api/summary (frontend/src/features/primarymenu). -->
          <span class="island-slot" id="sessions-count-island"></span>
          <!-- CMX-66: the VIEW menu (Status / Environment / Last activity / Group by / Sort by /
               Custom groups / Show empty groups / Show PR status), drawn here by the sidebar
               island (CMX-277, frontend/src/features/sidebar/lib/menus.tsx). -->
          <span class="side-view-slot" id="sidebar-view-menu"></span>
        </div>
        <!-- CMX-276: the React sidebar island (frontend/src/features/sidebar) draws the rows. -->
        <div class="side-list" id="sidebar-agents"></div>
      </section>

      <!-- Recent (dead) sessions (CMX-208): resuming a prior Claude conversation by its session
           id, drawn by the sidebar island (CMX-278, features/sidebar/lib/Recent.tsx) and absent
           when there is nothing to resume. -->
      <div class="side-recent-slot" id="side-recent-island"></div>

    </div><!-- /sidebar-scroll -->

    <!-- Fixed sidebar foot: ambient readouts + the one menu button that used to
         live in .topbar-actions. Not safety-critical (unlike shares/status-health
         below `</main>`) — reachable whenever the sidebar itself is, which is
         always on desktop and one drawer-open away on a phone. -->
    <div class="sidebar-foot">
      <!-- Host resources strip: live CPU/RAM/Disk (CMX-172), drawn by the resources island
           (frontend/src/features/resources, CMX-219). The % NUMBER is the signal, colour
           only decoration (Liav is red-weak); an unreadable metric hides itself. -->
      <span class="island-slot" id="resources-island"></span>
      <!-- CMX-393: the settings gear and its menu (Jump to, New, Share, Notifications,
           Settings, then the usage readouts), the primary menu island
           (frontend/src/features/primarymenu, CMX-219). ⌘K still opens the palette directly. -->
      <span class="island-slot" id="primary-menu-island"></span>
    </div>

    <!-- CMX-278: the desktop width handle (features/sidebar/lib/Resize.tsx). -->
    <div class="sidebar-resize-slot" id="sidebar-resize"></div>
  </aside>

  <!-- Main canvas: context-driven by sidebar selection -->
  <main class="canvas" id="canvas">

    <!-- Agent detail (focused single agent) -->
    <div class="panel" id="panel-agent-detail">
      <div id="agent-detail"></div>
    </div>

    <!-- WORK: Board · Runs · Schedules, one view over one /api/dispatcher poll. A React
         island (frontend/src/features/work, CMX-233) renders everything inside.
         CMX-89: it is the server-rendered FIRST panel only when terminals are
         off; with terminals on, #panel-terminals below carries `active` instead,
         so first paint is the Wall rather than Work-then-Wall once the bundle has
         loaded (worst on a phone). -->
    <div class="panel{% if not terminals_enabled %} active{% endif %}" id="panel-work"></div>

    {% if terminals_enabled %}
    <!-- Terminals wall (flagship view mode; streams live ttyd panes). Active in
         the markup (CMX-89): it is the default canvas whenever it exists, and
         main.js's selectView('terminals') re-selects it idempotently. -->
    <div class="panel active" id="panel-terminals">
        <div class="term-toolbar">
            <!-- mode toggle + single-agent picker kept (terminals.js refs them) but hidden: wall-only -->
            <button id="term-mode-single" onclick="chela.setTermMode('single')" style="display:none;">Single</button>
            <button id="term-mode-wall" onclick="chela.setTermMode('wall')" style="display:none;">Wall</button>
            <select id="term-agent" onchange="chela.renderTerminals()" style="display:none;"></select>
            <!-- The layout toolbar (presets, lock, auto-arrange, Focus), folded to one control
                 showing the current layout (CMX-397): the walltoolbar island
                 (frontend/src/features/walltoolbar, CMX-242). It shows in wall mode only. -->
            <span class="island-slot" id="wall-toolbar-island"></span>
            <!-- CMX-422: the active-shares pill's in-row copy, #term-shares (the share
                 feature's pill island, CMX-240, draws both copies). Desktop only: it takes
                 the row's flow slot at its right end, and while it shows, the floating
                 #btn-shares is hidden so it can't be drawn over the row. CMX-135: the
                 same for pending approvals (#term-approvals, the approvals island). -->
            <span class="shares-pill-slot" id="shares-pill-row"></span>
            <span class="island-slot" id="term-approvals-island"></span>
        </div>
        <div id="term-stage"></div>
        <!-- The Minimized tray: the walldock island (frontend/src/features/walldock, CMX-242). -->
        <div id="term-min-dock" hidden></div>
        <!-- The on-screen keys (CMX-237): the desktop #term-bar and the phone #term-keybar,
             drawn by the keybar island (frontend/src/features/keybar). -->
        <div id="keybar-island" class="keybar-island"></div>
    </div>
    {% endif %}

  </main>

</div>

<!-- Phone-only floating control that opens the off-canvas sidebar drawer
     (CMX-377). Desktop hides it (style.css): the sidebar's own toggle in
     .sidebar-head is always reachable there, since the sidebar never leaves
     the layout — it only narrows to an icon rail. -->
<button class="mobile-menu-fab" id="btn-menu-mobile" title="Menu" aria-label="Open menu"
        aria-expanded="false" onclick="chela.toggleSidebar()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>

<!-- Phone-only "+" beside the menu fab (CMX-386): New session in one tap, with the drawer
     left CLOSED (the launcher island, frontend/src/features/launcher). Out here, not in the
     sidebar, whose `transform` would trap it off-screen. Desktop hides it. -->
<span class="island-slot" id="new-fab-island"></span>

<!-- Always-on-top safety cluster (CMX-377): the native-status-feed outage
     warning and the active-shares kill-switch, floating above the canvas on
     every breakpoint. These used to sit in .topbar-actions, visible on every
     tab because the topbar was never off-canvas; the sidebar now IS off-canvas
     on a phone (position:fixed + transform), and a transformed ancestor traps
     any position:fixed descendant inside it instead of the viewport — so these
     two stay OUTSIDE the sidebar entirely, not just outside the drawer's scroll
     area, or a live share could go unseen behind a closed drawer. -->
<div class="safety-float">
  <!-- Native status feed health marker (CMX-179): shown whenever
       /api/agents/status_health reports not-ok (frontend/src/features/statushealth). -->
  <span class="island-slot" id="status-health-island"></span>
  <!-- Global active-shares indicator (safety kill-switch): shown on EVERY tab +
       mobile whenever any session is shared, so a forgotten live share (= an
       exposed terminal via a public link) is always one tap from Stop. NOT in
       the menu above — it must stay visible whenever a share is live. The share
       feature's pill island (CMX-240) draws it here as #btn-shares. -->
  <span class="shares-pill-slot" id="shares-pill-float"></span>
  <!-- Sandboxed guests' access requests (CMX-7) and pending approvals (CMX-103), each shown
       only while one waits: the safety islands (frontend/src/features/accessreq, approvals). -->
  <span class="island-slot" id="access-req-island"></span>
  <span class="island-slot" id="approvals-island"></span>
</div>

<!-- Mobile sidebar scrim (off-canvas drawer backdrop) -->
<div class="drawer-scrim" id="sidebar-scrim" onclick="chela.closeSidebar()"></div>

<!-- Overlays island (CMX-219, frontend/src/chrome.tsx Overlays): Settings, the ⌘K palette and
     the shortcuts sheet (CMX-221), the launch menu, the send-message dialog, the approvals and
     access-request sheets and the update banner. Each portals or fixes itself on the page. -->
<div id="overlays-island"></div>

<!-- New task (CMX-6): creates a Linear issue via the dashboard, the key never comes here.
     The New-task island (frontend/src/features/newtask) portals its dialog to <body>. -->
<div id="newtask-island"></div>

<!-- Task-detail modal (CMX-228): a kanban card or a Decisions row opens it. The task modal
     island (frontend/src/features/taskmodal) portals its dialog to <body>. -->
<div id="task-modal-island"></div>

<!-- Per-session changed-files / diff modal (CMX-299): a wall tile's "Files" chip opens it.
     The diff modal island (frontend/src/features/diffmodal) portals its dialog to <body>. -->
<div id="diff-modal-island"></div>
<!-- The Work toasts (a run changed state; a board note): outside every panel, so they show on any view. -->
<div id="work-toasts"></div>
<!-- The Active shares sheet (CMX-240): the kill switch's list, opened by either pill. -->
<div id="shares-sheet-island"></div>

<!-- CMX-217: the boot config the bundle reads (frontend/src/shared/api readBoot). -->
<script type="application/json" id="chela-boot">{{ boot|tojson }}</script>
<script src="{{ asset_path('vendor/gridstack-all.js') }}"></script>
<!-- CMX-215: the page's one module script, the Vite build (docs/FRONTEND.md): the React
     islands, then the legacy static/js graph (frontend/src/boot.ts), bundled together. Module
     scripts run after parsing, so the boot block and gridstack above exist by then. -->
{% if app_src %}<script type="module" src="{{ app_src }}"></script>{% endif %}
</body>
</html>

[project]
name = "chelamux"
version = "0.1.0"
description = "A tiny control plane for a fleet of Claude Code agents on tmux — schedule long-lived ones, dispatch ephemeral ones into git worktrees that open PRs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Liav Edry" }]
keywords = ["claude-code", "tmux", "agent-orchestration", "ai-agents", "developer-tools"]
dependencies = [
    "croniter>=2.0.0",   # cron expression parsing for the scheduler
    "pyyaml>=6.0",       # WORKFLOW.md front-matter parsing for the dispatcher
]

# The dashboard is an OPTIONAL flourish. The core (status/run/dispatch/msg)
# installs and runs without Flask. Install with `pip install chelamux[dashboard]`
# (or `uv sync --extra dashboard`) to enable `chela dashboard`.
[project.optional-dependencies]
dashboard = [
    "flask>=3.0",        # dashboard web app (agent wall + dispatch Kanban)
    "flask-sock>=0.7",   # same-origin /term/<wid> ttyd reverse proxy (WebSocket)
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
chela = "chela.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chela"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E501 (line length) off — ported code carries long descriptive lines/comments.
ignore = ["E501"]

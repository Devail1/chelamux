[project]
name = "chelamux"
version = "0.18.2"
description = "A tiny control plane for a fleet of Claude Code agents on tmux — schedule long-lived ones, dispatch ephemeral ones into git worktrees that open PRs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Liav Edry" }]
keywords = ["claude-code", "tmux", "agent-orchestration", "ai-agents", "developer-tools"]
dependencies = [
    "croniter>=2.0.0",   # cron expression parsing for the scheduler
    "pyyaml>=6.0",       # WORKFLOW.md front-matter parsing for the dispatcher
    # CMX-363: the dashboard is in the core install, so `uvx chelamux dashboard` works
    # with no extra to name (a bare `uvx chelamux` cannot pick one up).
    "flask>=3.0",        # dashboard web app (agent wall + dispatch Kanban)
    "flask-sock>=0.7",   # same-origin /term/<wid> ttyd reverse proxy (WebSocket)
    "cryptography>=42",  # E2E terminal-share crypto (HKDF-SHA256 + AES-256-GCM); interops with browser WebCrypto
]

[project.optional-dependencies]
# Kept, empty, so every existing `chelamux[dashboard]` install line and `uv sync --extra
# dashboard` still resolves. Its packages moved into the core dependencies (CMX-363).
dashboard = []

# The Telegram bridge is an OPTIONAL extra. The core installs and runs without
# it. Install with `pip install chelamux[telegram]` (or `uv sync --extra
# telegram`) to enable the Telegram Forum ↔ Claude Code session bridge.
# Adapted from six-ddc/ccbot (MIT) — see the top-level NOTICE file.
telegram = [
    "python-telegram-bot>=21.0",       # Telegram Bot API client for the bridge
    "Pillow>=10.0",                    # /screenshot: render a tmux pane -> PNG (ANSI colour)
    "fonttools>=4.0",                  # /screenshot: per-glyph font-fallback coverage (cmap lookup)
    "telegramify-markdown>=0.5,<1.0",  # render Claude's Markdown body as real MarkdownV2 entities
]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",               # parallel test runner — see addopts below for the worker count
    "ruff>=0.6",
    "telegramify-markdown>=0.5,<1.0",  # so format tests exercise real rendering (CI omits [telegram])
    "fonttools[woff]>=4.0",            # read the terminal's woff2 fonts in the glyph tests; build_term_fonts.py
]

[project.scripts]
chela = "chela.main:main"
# CMX-363: named after the PyPI package, so `uvx chelamux …` runs without `--from`.
chelamux = "chela.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chela"]
# The React source and its node_modules: the built bundle (chela/dashboard/static/app) is
# committed, so an installed chela never needs either.
exclude = ["chela/dashboard/frontend"]

# The statusLine hook lives in scripts/ (its tests and the PM2 setup run it from there);
# `chela install-statusline` finds this copy when chela runs from an installed wheel.
[tool.hatch.build.targets.wheel.force-include]
"scripts/cache-statusline.sh" = "chela/scripts/cache-statusline.sh"

# What a wheel is built from, and nothing else: a dev checkout's node_modules (symlinked in
# by pnpm) would otherwise land in the sdist. tests/test_packaging.py checks both artifacts.
[tool.hatch.build.targets.sdist]
only-include = ["chela", "scripts/cache-statusline.sh", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]
exclude = ["node_modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run in parallel by default. The suite is ~28 min serial (100% of CI's wall-clock is this
# run — every other step totals ~14s), and it is longer than the judge's 900s test-command
# timeout, so parallelism rescues BOTH surfaces at once: CI and the in-worktree judge.
#
# `--dist loadfile`: distribute by FILE, never split one file across workers. This keeps
# each test file's tests together and on ONE worker, which is what makes it safe — the two
# "live" suites (test_epoch_live, test_terminals_selfheal) drive a real tmux server on an
# isolated `-L chelatest-…` scratch socket, and never having their tests race on separate
# workers is why we don't need per-test socket names. conftest already gives every test its
# own scratch CHELA_DIR, so state files never collide either.
#
# To debug a single test serially (real -s output, pdb), pass `-n0` on the command line.
#
# `-n 4`, NOT `-n auto`: capped on purpose. CI runs on a 4-core runner, so 4 is already
# `auto` there — but the JUDGE runs this same suite on the dev box DURING a dispatch, next
# to live agents, and `auto` there is ~20 workers each spawning git/node. On a box where an
# OOM takes down the whole tmux fleet, a 20-worker spike next to the agents is not worth the
# ~1min-vs-2min it buys; 4 keeps the judge fast without the memory surge. Raise it per-run
# with `-n auto`/`-n <N>` on the command line when you know the box is idle.
addopts = "-n 4 --dist loadfile"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E501 (line length) off — ported code carries long descriptive lines/comments.
ignore = ["E501"]

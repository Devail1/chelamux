name: Release

# Builds a GitHub Release from a tag a human already pushed by hand, following
# "Releasing" in CONTRIBUTING.md. Steps 1-4 there (bump pyproject.toml, promote
# CHANGELOG's Unreleased section, commit, `git tag` + `git push`) stay a deliberate
# human act — CI NEVER creates or pushes a tag itself. This workflow only automates
# step 5: turning that already-pushed tag into a published Release whose body is
# CHANGELOG.md's matching section, extracted by the tested `chela.release_notes`
# module (never inline sed/awk here), so the notes can't drift from what the tag
# actually documents or be hand-retyped a second time.
#
# `--verify-tag` on the publish step is load-bearing, not decoration: `gh release
# create v<X>` CREATES the tag at the default branch when `v<X>` doesn't already
# exist, so without it this workflow could tag on the `workflow_dispatch` path
# (dry_run=false, CHANGELOG section promoted, tag not yet pushed) — exactly the
# "CI never tags" boundary this header claims. `tests/test_release_workflow.py`
# guards every invariant in this file; corrupt one and it goes red.
#
# CMX-363: the `pypi` job then publishes the same tag to PyPI (`uvx chelamux dashboard`),
# with Trusted Publishing — PyPI trusts this workflow's OIDC token, so no API token exists
# anywhere to leak. It runs only on a tag push, from the tag's own checkout, after the
# GitHub Release succeeded, and refuses a tag that disagrees with pyproject's version
# (a PyPI version can never be re-uploaded, so a mismatch must stop before the upload).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build notes for, e.g. 0.3.0 (no leading 'v')"
        required: true
      dry_run:
        description: "Print the extracted notes only — do not call `gh release create`"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skips cleanly on a fork instead of failing red trying to publish someone else's release.
    if: github.repository == 'Devail1/chelamux'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync
        run: uv sync

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        run: uv run python -m chela.release_notes "${{ steps.version.outputs.value }}" > notes.md

      - name: Show extracted notes
        run: cat notes.md

      # A `push: tags` event is never a dry run — the tag itself was the deliberate
      # human act that triggered this job. `workflow_dispatch` defaults to dry_run
      # so the extraction above can be exercised against an already-tagged version
      # (e.g. v0.3.0) to prove it's correct without publishing anything.
      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.value }}" \
            --verify-tag \
            --title "v${{ steps.version.outputs.value }}" \
            --notes-file notes.md

  pypi:
    needs: release
    runs-on: ubuntu-latest
    # Only a pushed tag publishes: a `workflow_dispatch` run checks out the default branch,
    # not the tag, so its build would not be the code the version names.
    if: github.repository == 'Devail1/chelamux' && github.event_name == 'push'
    # The environment PyPI's trusted publisher is registered for (owner Devail1, repo
    # chelamux, workflow release.yml, environment pypi).
    environment:
      name: pypi
      url: https://pypi.org/project/chelamux/
    permissions:
      contents: read
      id-token: write   # Trusted Publishing: the OIDC token PyPI exchanges for an upload
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check the tag matches pyproject's version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi

      - name: Build sdist + wheel
        run: uv build

      - name: Smoke-test the built wheel
        run: uvx --from dist/chelamux-*.whl chelamux --help

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
